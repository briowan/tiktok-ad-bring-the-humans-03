<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <!-- Gradasi Utama -->
    <linearGradient id="bodyShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>

    <!-- Efek Bayangan & Cahaya Halus -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#64748B" flood-opacity="0.22" />
    </filter>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Bayangan Lantai (Efek Melayang) -->
  <ellipse cx="250" cy="434" rx="65" ry="10" fill="#94A3B8" opacity="0.28" />

  <!-- Karakter Utama -->
  <g transform="translate(0, 8)">
    <g>
      <!-- Antena Simpel -->
      <path d="M 250 92 L 250 62" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
      <circle cx="250" cy="52" r="13" fill="url(#cyanGrad)" filter="url(#softGlow)" />
      <circle cx="246" cy="48" r="4" fill="#FFFFFF" opacity="0.85" />

      <!-- Badan Kapsul Minimalis -->
      <path d="M 192 260 L 308 260 C 318 345, 292 385, 250 385 C 208 385, 182 345, 192 260 Z" fill="url(#bodyShell)" stroke="#E2E8F0" stroke-width="3" filter="url(#softShadow)" />

      <!-- Inti Energi Dada (Glowing Core) -->
      <g>
        <rect x="234" y="304" width="32" height="32" rx="10" transform="rotate(45 250 320)" fill="url(#pinkGrad)" filter="url(#softGlow)" />
        <rect x="241" y="311" width="18" height="18" rx="5" transform="rotate(45 250 320)" fill="#FFFFFF" opacity="0.6" />
      </g>

      <!-- Tangan Melayang Simpel (Floating Paws) -->
      <g>
        <rect x="108" y="282" width="46" height="64" rx="23" transform="rotate(-14 131 314)" fill="url(#bodyShell)" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#softShadow)" />
        <rect x="346" y="282" width="46" height="64" rx="23" transform="rotate(14 369 314)" fill="url(#bodyShell)" stroke="url(#pinkGrad)" stroke-width="4" filter="url(#softShadow)" />
      </g>
      <!-- Ear-Pods Samping (Menyatu & Ikonik) -->
      <rect x="104" y="142" width="32" height="76" rx="16" fill="url(#cyanGrad)" filter="url(#softShadow)" />
      <rect x="364" y="142" width="32" height="76" rx="16" fill="url(#pinkGrad)" filter="url(#softShadow)" />

      <!-- Kepala Helm Kapsul -->
      <rect x="122" y="88" width="256" height="184" rx="88" fill="url(#bodyShell)" stroke="#E2E8F0" stroke-width="4" filter="url(#softShadow)" />

      <!-- Layar Wajah (Visor) -->
      <rect x="144" y="110" width="212" height="140" rx="68" fill="#090D16" />
      <!-- Pantulan Kaca Visor -->
      <path d="M 185 122 Q 250 115 315 122" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.18" />

      <!-- Mata Kiri & Kanan (Play Icon Glow) -->
      <rect x="172" y="148" width="46" height="58" rx="23" fill="url(#cyanGrad)" filter="url(#softGlow)" />
      <circle cx="184" cy="162" r="4.5" fill="#FFFFFF" opacity="0.9" />
      <polygon points="190,168 205,177 190,186" fill="#090D16" />

      <rect x="282" y="148" width="46" height="58" rx="23" fill="url(#cyanGrad)" filter="url(#softGlow)" />
      <circle cx="294" cy="162" r="4.5" fill="#FFFFFF" opacity="0.9" />
      <polygon points="300,168 315,177 300,186" fill="#090D16" />
      <!-- Pipi Merona Neon -->
      <ellipse cx="164" cy="204" rx="10" ry="6" fill="#FF0844" opacity="0.8" filter="url(#softGlow)" />
      <ellipse cx="336" cy="204" rx="10" ry="6" fill="#FF0844" opacity="0.8" filter="url(#softGlow)" />

      <!-- Senyum Ramah -->
      <path d="M 235 204 Q 250 219 265 204" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />

      <!-- Mini Audio Equalizer Badge di Sudut Visor -->
      <g fill="#00F2FE" opacity="0.9">
        <rect x="304" y="218" width="4" height="12" rx="2" />
        <rect x="311" y="212" width="4" height="20" rx="2" />
        <rect x="318" y="215" width="4" height="15" rx="2" />
      </g>
    </g>
  </g>
</svg>